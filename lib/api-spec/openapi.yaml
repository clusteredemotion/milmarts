openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Shopify storefront catalog and checkout operations
  - name: orders
    description: Milmarts-local orders and payment processing
  - name: notifications
    description: Opt-in browser push notifications and staff broadcasts
  - name: admin
    description: Milmarts staff tools and account administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront/visitor-market:
    get:
      operationId: getStorefrontVisitorMarket
      tags: [storefront]
      summary: Get visitor currency and exchange rates
      responses:
        "200":
          description: Visitor country, currency, and exchange rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorMarket"
        "503":
          description: Exchange-rate provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storefront/products:
    get:
      operationId: listStorefrontProducts
      tags: [storefront]
      summary: List products from the local Milmarts catalog
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: first
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 24
            default: 12
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Published local products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storefront/products/{handle}:
    get:
      operationId: getStorefrontProduct
      tags: [storefront]
      summary: Get a published local product by handle
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shopify product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storefront/cart:
    post:
      operationId: createStorefrontCart
      tags: [storefront]
      summary: Create a local Milmarts cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartInput"
      responses:
        "201":
          description: Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid cart request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStorefrontCart
      tags: [storefront]
      summary: Update a Shopify cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartUpdateInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid cart request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify storefront unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    get:
      operationId: listLocalOrders
      tags: [orders]
      summary: List the signed-in user's Milmarts orders
      responses:
        "200":
          description: Local Milmarts order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalOrderList"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/wallet:
    post:
      operationId: payForOrderWithWallet
      tags: [orders]
      summary: Pay for a local order using the Milmarts wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalOrderCheckoutInput"
      responses:
        "201":
          description: Wallet-paid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalOrder"
        "400":
          description: Invalid checkout details or cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient wallet balance or checkout already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Current product prices could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/flutterwave:
    post:
      operationId: startFlutterwaveOrderPayment
      tags: [orders]
      summary: Start Flutterwave payment for a local order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalOrderCheckoutInput"
      responses:
        "201":
          description: Flutterwave order payment session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlutterwaveOrderPayment"
        "400":
          description: Invalid checkout details or cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Checkout already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Flutterwave or current product prices unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{orderNumber}/reconcile:
    post:
      operationId: reconcileFlutterwaveOrderPayment
      tags: [orders]
      summary: Verify and update a pending card order
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current local order and verified payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalOrder"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/tracking:
    get:
      operationId: listTrackingOrders
      tags: [orders]
      summary: List orders available to the signed-in customer or tracking staff
      responses:
        "200":
          description: Orders and tracking permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingOrdersResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{orderNumber}/tracking:
    patch:
      operationId: updateLocalOrderTracking
      tags: [orders]
      summary: Add a manual fulfillment update and carrier link
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocalOrderTrackingInput"
      responses:
        "200":
          description: Updated local order tracking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalOrder"
        "400":
          description: Invalid tracking update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tracking staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Paid order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only paid orders can be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications/status:
    get:
      operationId: getNotificationStatus
      tags: [notifications]
      summary: Get push notification setup and account subscription status
      responses:
        "200":
          description: Push availability and the signed-in user's subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications/subscription:
    post:
      operationId: savePushSubscription
      tags: [notifications]
      summary: Save this signed-in user's browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: Push subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "400":
          description: Invalid push subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Push notifications are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removePushSubscription
      tags: [notifications]
      summary: Remove this signed-in user's browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscriptionInput"
      responses:
        "200":
          description: Push subscription removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Load the Milmarts administration overview
      responses:
        "200":
          description: Store administration counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardSummary"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: Search products in the local Milmarts catalog
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - in: query
          name: category
          schema:
            type: string
            maxLength: 100
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Local products, including unpublished products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductList"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminProduct
      tags: [admin]
      summary: Add a product directly to the Milmarts catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "201":
          description: Created local product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Product handle already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/import:
    post:
      operationId: importAdminShopifyProducts
      tags: [admin]
      summary: Read Shopify products and import new products locally
      responses:
        "200":
          description: Import counts; existing local edits are left unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportResult"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify catalog could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{productId}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      summary: Edit a local product without updating Shopify
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpdateInput"
      responses:
        "200":
          description: Updated local product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Local product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Product handle already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      summary: Delete a local product while retaining order snapshots
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Local product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDeleteResult"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Local product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search local Milmarts customer accounts
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching customer accounts without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Edit a customer's profile details
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateInput"
      responses:
        "200":
          description: Updated customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserRecord"
        "400":
          description: Invalid profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email address is already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/transactions:
    get:
      operationId: getAdminTransactions
      tags: [admin]
      summary: View wallet and order payment records
      responses:
        "200":
          description: Recent wallet ledger, funding attempts, and local order payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionsDashboard"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/staff:
    get:
      operationId: listAdminStaff
      tags: [admin]
      summary: List staff assignments
      responses:
        "200":
          description: Staff accounts and the primary administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffList"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: assignAdminStaff
      tags: [admin]
      summary: Grant staff access to an existing customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffAssignmentInput"
      responses:
        "200":
          description: Staff access assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffRecord"
        "400":
          description: Invalid staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Primary administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/staff/{userId}:
    delete:
      operationId: revokeAdminStaff
      tags: [admin]
      summary: Revoke staff access without deleting the account
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Staff access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffActionResult"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Primary administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Active staff assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications/admin:
    get:
      operationId: getAdminNotifications
      tags: [notifications]
      summary: Load broadcast settings and notification history for staff
      responses:
        "200":
          description: Subscriber count, push readiness, and recent broadcasts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationsDashboard"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications/admin/send:
    post:
      operationId: sendAdminPushNotification
      tags: [notifications]
      summary: Send a push notification to opted-in users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPushNotificationInput"
      responses:
        "200":
          description: Push notification delivery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPushNotificationResult"
        "400":
          description: Invalid notification content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Staff access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Push notifications are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductImage:
      type: object
      properties:
        url:
          type: string
        altText:
          type: ["string", "null"]
      required: [url]
    Money:
      type: object
      properties:
        amount:
          type: string
        currencyCode:
          type: string
      required: [amount, currencyCode]
    NairaMoney:
      type: object
      properties:
        amount:
          type: string
        currencyCode:
          type: string
          enum: [NGN]
        rateUpdatedAt:
          type: ["string", "null"]
          format: date-time
        rateIsStale:
          type: boolean
      required: [amount, currencyCode, rateUpdatedAt, rateIsStale]
    VisitorMarket:
      type: object
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        rates:
          type: object
          additionalProperties:
            type: number
        updatedAt:
          type: string
          format: date-time
        isStale:
          type: boolean
      required: [countryCode, currencyCode, rates, updatedAt, isStale]
    NairaPriceRange:
      type: object
      properties:
        minVariantPrice:
          oneOf:
            - $ref: "#/components/schemas/NairaMoney"
            - type: "null"
